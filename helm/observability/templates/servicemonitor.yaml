{{- range .Values.appNamespaces }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: url-shortener-{{ . }}
  namespace: {{ . }}
  labels:
    # Must match the kube-prometheus-stack serviceMonitorSelector
    release: observability
spec:
  # Sets job="url-shortener" on scraped metrics — without this Prometheus
  # auto-generates a messy job label from the ServiceMonitor name.
  jobLabel: "app.kubernetes.io/name"
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      # Copy the k8s namespace into a `namespace` label so {namespace="..."} works in PromQL
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
{{- end }}
