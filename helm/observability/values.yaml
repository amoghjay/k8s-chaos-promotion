# Namespaces where the URL shortener runs — a ServiceMonitor is created for each
appNamespaces:
  - url-shortener-dev
  - url-shortener-staging
  - url-shortener-prod

kube-prometheus-stack:
  grafana:
    # ESO-managed secret — see kubernetes/bootstrap/secrets/external-secrets-monitoring.yaml
    admin:
      existingSecret: grafana-admin-secret
      userKey: username
      passwordKey: password

    # Loki service name is <release>-loki; ArgoCD uses the app name as release name
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://observability-loki:3100
        access: proxy
        isDefault: false

    # Pick up dashboard ConfigMaps labelled grafana_dashboard=1 from any namespace
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL

  prometheus:
    prometheusSpec:
      retention: 7d

      # PVC-backed — the emptyDir default loses metrics across node scale-to-zero
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: standard
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

      # Watch ServiceMonitors labelled release=observability in all namespaces
      serviceMonitorSelector:
        matchLabels:
          release: observability
      serviceMonitorNamespaceSelector: {}

  alertmanager:
    enabled: false

  nodeExporter:
    enabled: true

promtail:
  config:
    clients:
      - url: http://observability-loki:3100/loki/api/v1/push

loki:
  deploymentMode: SingleBinary

  chunksCache:
    enabled: false  # not needed in single-binary/filesystem mode
  resultsCache:
    enabled: false  # not needed in single-binary/filesystem mode

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem

    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem    # intentional — logs are ephemeral by design; swap to gcs for persistence
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # Compactor must be enabled for retention_period to actually delete old logs
    compactor:
      retention_enabled: true
      delete_request_store: filesystem # no object store in single-binary mode

    limits_config:
      retention_period: 48h

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 1Gi

  # Disable multi-tenant components not needed in single-binary mode
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
