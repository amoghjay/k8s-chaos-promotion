image:
  tag: "sha-c41053e"  # pinned to a staging-verified image — never ":latest"

replicaCount: 2

podAntiAffinity:
  enabled: true
podDisruptionBudget:
  enabled: true
  minAvailable: 1

app:
  baseUrl: "http://localhost:8080"
  workers: "1"   # see values.yaml — >1 fabricates phantom traffic

radius:
  enabled: true
  facilitatorUrl: "https://facilitator.radiustech.xyz"  # mainnet facilitator
  networkCaip2: "eip155:723487"
  serviceWalletAddress: ""    # injected via ESO ExternalSecret
  chainId: "723487"           # mainnet chain ID
  facilitatorTimeoutSeconds: "30"

resources:
  requests: { cpu: 200m, memory: 256Mi }
  limits: { cpu: 1000m, memory: 1Gi }

postgresql:
  auth:
    existingSecret: url-shortener-prod-secret
  primary:
    persistence:
      enabled: true
      size: 5Gi

serviceAccount:
  annotations: {}

externalSecrets:
  enabled: true
  serviceWalletSecret: "service-wallet-address-mainnet"
