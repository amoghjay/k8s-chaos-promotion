image:
  tag: "sha-c41053e"  # pinned off ":latest" — old :latest lacked /livez and caused a
                      # liveness restart loop (gate-hole: the /livez probe reached prod
                      # ungated). sha-c41053e is the dev/staging-verified image with /livez.

replicaCount: 2

podAntiAffinity:
  enabled: true
podDisruptionBudget:
  enabled: true
  minAvailable: 1

app:
  baseUrl: "http://localhost:8080"
  workers: "4"

radius:
  enabled: true
  facilitatorUrl: "https://facilitator.radiustech.xyz"  # mainnet facilitator
  networkCaip2: "eip155:723487"
  serviceWalletAddress: ""    # injected via ESO ExternalSecret
  chainId: "723487"           # mainnet — corrected from old 723 per Radius chain-ID migration
  facilitatorTimeoutSeconds: "30"

resources:
  requests: { cpu: 200m, memory: 256Mi }
  limits: { cpu: 1000m, memory: 1Gi }

postgresql:
  auth:
    existingSecret: url-shortener-prod-secret
  primary:
    persistence:
      enabled: true
      size: 5Gi

serviceAccount:
  annotations: {}             # WI binding added in Phase 4/5 when ESO is set up

externalSecrets:
  enabled: true
  serviceWalletSecret: "service-wallet-address-mainnet"
