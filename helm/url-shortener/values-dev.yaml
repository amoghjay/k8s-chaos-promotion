image:
  tag: sha-c41053e

replicaCount: 1

# Single replica in dev — no PDB or anti-affinity needed
podAntiAffinity:
  enabled: false
podDisruptionBudget:
  enabled: false

app:
  baseUrl: "http://localhost:8080"
  workers: "1"

radius:
  enabled: true
  # facilitatorUrl + networkCaip2 default to testnet via values.yaml
  serviceWalletAddress: ""    # passed via --set at install time

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 200m, memory: 256Mi }

serviceAccount:
  annotations: {}

postgresql:
  auth:
    existingSecret: url-shortener-dev-secret

externalSecrets:
  enabled: true
  serviceWalletSecret: "service-wallet-address-testnet"
