image:
  tag: sha-c41053e

replicaCount: 2

# Spread pods across nodes; keep at least 1 running through voluntary disruptions.
podAntiAffinity:
  enabled: true
podDisruptionBudget:
  enabled: true
  minAvailable: 1

app:
  baseUrl: "http://localhost:8080"
  workers: "1"   # see values.yaml — >1 fabricates phantom traffic

radius:
  enabled: true
  # facilitatorUrl + networkCaip2 default to testnet via values.yaml
  serviceWalletAddress: ""    # passed via --set at install time
  facilitatorTimeoutSeconds: "30"  # generous — facilitator does the on-chain work

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

serviceAccount:
  annotations: {}

postgresql:
  auth:
    existingSecret: url-shortener-staging-secret

externalSecrets:
  enabled: true
  serviceWalletSecret: "service-wallet-address-testnet"
