apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: url-shortener
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: url-shortener
      sources:
        stages:
          - staging  # only receives freight that has been verified in staging

  # RENDERED-BRANCHES pattern — see stage-dev.yaml for the rationale.
  # Prod is a MANUAL gate via ProjectConfig (autoPromotionEnabled: false) — a human
  # approves the promotion in the Kargo UI before these steps run. That approval IS
  # the gate, so we no longer need the old git-open-pr / git-wait-for-pr dance.
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: https://github.com/amoghjay/k8s-chaos-promotion.git
        - name: image
          value: us-central1-docker.pkg.dev/ajprojectplatform/k8s-chaos-demo/url-shortener

      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - commit: ${{ commitFrom(vars.repoURL).ID }}
                path: ./src
              - branch: env/${{ ctx.stage }}
                path: ./out
                create: true
        - uses: yaml-update
          config:
            path: ./src/helm/url-shortener/values-${{ ctx.stage }}.yaml
            updates:
              - key: image.tag
                value: ${{ quote(imageFrom(vars.image).Tag) }}
        - uses: git-clear
          config:
            path: ./out
        - uses: helm-template
          config:
            path: ./src/helm/url-shortener
            releaseName: url-shortener-${{ ctx.stage }}
            namespace: url-shortener-${{ ctx.stage }}
            valuesFiles:
              - ./src/helm/url-shortener/values.yaml
              - ./src/helm/url-shortener/values-${{ ctx.stage }}.yaml
            outPath: ./out
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: "render ${{ ctx.stage }} @ ${{ imageFrom(vars.image).Tag }}"
        - uses: git-push
          config:
            path: ./out
        - uses: argocd-update
          config:
            apps:
              - name: url-shortener-${{ ctx.stage }}
                sources:
                  - repoURL: ${{ vars.repoURL }}

  # No verification — prod is the manual approval gate (Kargo UI) only.
