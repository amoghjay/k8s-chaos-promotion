apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: url-shortener
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: url-shortener
      sources:
        direct: true

  # Rendered-branches pattern: promotion renders the chart to plain YAML at the
  # freight's commit + image tag and pushes it to env/<stage>; ArgoCD applies that
  # branch directly (no in-cluster Helm), so chart/config changes are gated per env.
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: https://github.com/amoghjay/k8s-chaos-promotion.git
        - name: image
          value: us-central1-docker.pkg.dev/ajprojectplatform/k8s-chaos-demo/url-shortener

      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - commit: ${{ commitFrom(vars.repoURL).ID }}
                path: ./src
              - branch: env/${{ ctx.stage }}
                path: ./out
                create: true

        # Image tag is set in the working copy only — main is never pushed.
        - uses: yaml-update
          config:
            path: ./src/helm/url-shortener/values-${{ ctx.stage }}.yaml
            updates:
              - key: image.tag
                value: ${{ quote(imageFrom(vars.image).Tag) }}

        # Wipe the previous render so removed resources don't linger.
        - uses: git-clear
          config:
            path: ./out

        # Chart deps are vendored in charts/*.tgz, so rendering needs no network pull.
        - uses: helm-template
          config:
            path: ./src/helm/url-shortener
            releaseName: url-shortener-${{ ctx.stage }}
            namespace: url-shortener-${{ ctx.stage }}
            valuesFiles:
              - ./src/helm/url-shortener/values.yaml
              - ./src/helm/url-shortener/values-${{ ctx.stage }}.yaml
            outPath: ./out

        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: "render ${{ ctx.stage }} @ ${{ imageFrom(vars.image).Tag }}"
        - uses: git-push
          config:
            path: ./out

        # targetRevision is statically env/<stage> in the ApplicationSet, so Kargo
        # only nudges a sync and never mutates it (no ApplicationSet clobber fight).
        - uses: argocd-update
          config:
            apps:
              - name: url-shortener-${{ ctx.stage }}
                sources:
                  - repoURL: ${{ vars.repoURL }}

  # Staging only receives freight that passed this verification.
  verification:
    analysisTemplates:
      - name: health-check
    args:
      - name: service-url
        value: http://url-shortener-dev.url-shortener-dev.svc.cluster.local:80
