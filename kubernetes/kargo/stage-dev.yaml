apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: url-shortener
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: url-shortener
      sources:
        direct: true  # gets freight directly from Warehouse (not from another stage)

  # RENDERED-BRANCHES pattern (Kargo's recommended approach):
  # promotion RENDERS the chart to plain YAML at the freight's git commit + image
  # tag, then commits to the env/<stage> branch. ArgoCD apps track env/<stage> and
  # just apply plain YAML (no in-cluster Helm). A change reaches an env ONLY via a
  # promotion that re-renders — closing the gate-hole. `main` is never written by
  # promotions; the env branch IS the deployment record. See LEARNINGS.md §6.1.
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: https://github.com/amoghjay/k8s-chaos-promotion.git
        - name: image
          value: us-central1-docker.pkg.dev/ajprojectplatform/k8s-chaos-demo/url-shortener

      steps:
        # 1. Check out the FREIGHT's git commit (chart+config source) to ./src,
        #    and the env branch to ./out (created on first run).
        - uses: git-clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - commit: ${{ commitFrom(vars.repoURL).ID }}
                path: ./src
              - branch: env/${{ ctx.stage }}
                path: ./out
                create: true

        # 2. Inject the freight's image tag into the WORKING COPY only (never pushed
        #    to main — main stays human-authored source).
        - uses: yaml-update
          config:
            path: ./src/helm/url-shortener/values-${{ ctx.stage }}.yaml
            updates:
              - key: image.tag
                value: ${{ quote(imageFrom(vars.image).Tag) }}

        # 3. Wipe the previous render so removed resources don't linger.
        - uses: git-clear
          config:
            path: ./out

        # 4. Render the chart to plain YAML (deps vendored in charts/*.tgz, so no
        #    network pull; validated locally to render cleanly).
        - uses: helm-template
          config:
            path: ./src/helm/url-shortener
            releaseName: url-shortener-${{ ctx.stage }}
            namespace: url-shortener-${{ ctx.stage }}
            valuesFiles:
              - ./src/helm/url-shortener/values.yaml
              - ./src/helm/url-shortener/values-${{ ctx.stage }}.yaml
            outPath: ./out

        # 5. Commit + push the rendered manifests to env/<stage> (NOT main).
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: "render ${{ ctx.stage }} @ ${{ imageFrom(vars.image).Tag }}"
        - uses: git-push
          config:
            path: ./out

        # 6. Nudge ArgoCD to sync. targetRevision is statically env/<stage> in the
        #    ApplicationSet, so Kargo never mutates it (no AppSet clobber fight).
        - uses: argocd-update
          config:
            apps:
              - name: url-shortener-${{ ctx.stage }}
                sources:
                  - repoURL: ${{ vars.repoURL }}

  # After promotion, verify health before marking freight verified.
  # Staging only receives freight that passed this.
  verification:
    analysisTemplates:
      - name: health-check
    args:
      - name: service-url
        value: http://url-shortener-dev.url-shortener-dev.svc.cluster.local:80
