apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: health-check
  namespace: url-shortener
spec:
  args:
    # Passed by each Stage — e.g. http://url-shortener-dev.url-shortener-dev.svc.cluster.local:8000
    - name: service-url

  metrics:
    - name: health-check
      # Run 3 times, 20s apart — confirms the app is stably healthy, not just briefly up
      count: 3
      interval: 20s
      failureLimit: 1  # allow 1 failure (transient blip) before marking unhealthy

      provider:
        web:
          url: "{{args.service-url}}/health"
          jsonPath: "{$.status}"

      # Accept both "ok" (all deps up) and "degraded" (redis down, app still functional)
      # Fail only on "unhealthy" (postgres down) or non-200 HTTP response
      successCondition: result == "ok" || result == "degraded"
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: chaos-gate
  namespace: url-shortener
spec:
  metrics:
    - name: chaos-gate
      # `job` provider: the Job's EXIT CODE is the verdict. orchestrate.sh runs
      # the chaos Workflow under load, scores each experiment over its node's
      # window, and exits 0 (all SLOs held) / 1 (any collapsed). No
      # successCondition needed — Argo Rollouts maps job success/failure directly.
      provider:
        job:
          spec:
            backoffLimit: 0               # a gate must not retry — a retry masks the signal
            activeDeadlineSeconds: 1200   # hard cap (~20m); the gate itself is ~10-12m
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                # SA lives in url-shortener (this ns); RoleBinding in staging grants
                # the cross-namespace verbs the orchestrator needs. See chaos-gate-rbac.yaml.
                serviceAccountName: chaos-gate
                restartPolicy: Never
                containers:
                  - name: gate
                    image: us-central1-docker.pkg.dev/ajprojectplatform/k8s-chaos-demo/gate-runner:v1
                    imagePullPolicy: Always   # :v1 is a stable MUTABLE tag — re-pull each run so a kubectl bump isn't masked by a cached layer
                    command: ["bash", "/scripts/orchestrate.sh"]
                    env:
                      # annotate.py posts the verdict to Grafana's dashboard timeline.
                      # Admin basic-auth: survives Grafana's ephemeral (no-PVC) DB, unlike
                      # a service-account token that a restart wipes. See external-secret-grafana.yaml.
                      - name: GRAFANA_URL
                        value: http://observability-grafana.monitoring.svc
                      - name: GRAFANA_USER
                        value: admin
                      - name: GRAFANA_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: grafana-annotation   # ESO-synced (external-secret-grafana.yaml) — now holds the admin password
                            key: password
                            optional: true              # gate still runs if the secret's absent; annotate.py self-skips
                    volumeMounts:
                      - name: scripts
                        mountPath: /scripts
                volumes:
                  - name: scripts
                    configMap:
                      name: chaos-gate-scripts   # generated by chaos-experiments/kustomization.yaml
