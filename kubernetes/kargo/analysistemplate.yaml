apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: health-check
  namespace: url-shortener
spec:
  args:
    # Set by each Stage to that environment's service URL
    - name: service-url

  metrics:
    - name: health-check
      count: 3
      interval: 20s
      failureLimit: 1  # tolerate one transient blip

      provider:
        web:
          url: "{{args.service-url}}/health"
          jsonPath: "{$.status}"

      # "degraded" (redis down, app still functional) passes; only "unhealthy"
      # (postgres down) or a non-200 response fails.
      successCondition: result == "ok" || result == "degraded"
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: chaos-gate
  namespace: url-shortener
spec:
  metrics:
    - name: chaos-gate
      # No successCondition — the Job's exit code is the verdict (0 = all SLOs held).
      provider:
        job:
          spec:
            backoffLimit: 0               # a gate must not retry — a retry masks the signal
            activeDeadlineSeconds: 1200   # hard cap; the gate itself runs ~10-12m
            ttlSecondsAfterFinished: 3600
            template:
              spec:
                # SA lives in this ns; a RoleBinding in staging grants the
                # cross-namespace verbs the orchestrator needs (chaos-gate-rbac.yaml).
                serviceAccountName: chaos-gate
                restartPolicy: Never
                containers:
                  - name: gate
                    image: us-central1-docker.pkg.dev/ajprojectplatform/k8s-chaos-demo/gate-runner:v1
                    imagePullPolicy: Always   # :v1 is a mutable tag — re-pull each run
                    command: ["bash", "/scripts/orchestrate.sh"]
                    env:
                      # Grafana admin basic-auth for verdict annotations — survives
                      # Grafana's ephemeral (no-PVC) DB, unlike a service-account token.
                      - name: GRAFANA_URL
                        value: http://observability-grafana.monitoring.svc
                      - name: GRAFANA_USER
                        value: admin
                      - name: GRAFANA_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: grafana-annotation   # ESO-synced (external-secret-grafana.yaml)
                            key: password
                            optional: true              # gate still runs if absent; annotate.py self-skips
                    volumeMounts:
                      - name: scripts
                        mountPath: /scripts
                volumes:
                  - name: scripts
                    configMap:
                      name: chaos-gate-scripts   # generated by chaos-experiments/kustomization.yaml
