apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: url-shortener
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: url-shortener
      sources:
        stages:
          - dev  # only receives freight that has been verified in dev

  # RENDERED-BRANCHES pattern — see stage-dev.yaml for the rationale.
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: https://github.com/amoghjay/k8s-chaos-promotion.git
        - name: image
          value: us-central1-docker.pkg.dev/ajprojectplatform/k8s-chaos-demo/url-shortener

      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - commit: ${{ commitFrom(vars.repoURL).ID }}
                path: ./src
              - branch: env/${{ ctx.stage }}
                path: ./out
                create: true
        - uses: yaml-update
          config:
            path: ./src/helm/url-shortener/values-${{ ctx.stage }}.yaml
            updates:
              - key: image.tag
                value: ${{ quote(imageFrom(vars.image).Tag) }}
        - uses: git-clear
          config:
            path: ./out
        - uses: helm-template
          config:
            path: ./src/helm/url-shortener
            releaseName: url-shortener-${{ ctx.stage }}
            namespace: url-shortener-${{ ctx.stage }}
            valuesFiles:
              - ./src/helm/url-shortener/values.yaml
              - ./src/helm/url-shortener/values-${{ ctx.stage }}.yaml
            outPath: ./out
        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: "render ${{ ctx.stage }} @ ${{ imageFrom(vars.image).Tag }}"
        - uses: git-push
          config:
            path: ./out
        - uses: argocd-update
          config:
            apps:
              - name: url-shortener-${{ ctx.stage }}
                sources:
                  - repoURL: ${{ vars.repoURL }}

  # Health check after promotion. Phase 6.3 appends `chaos-gate` here (after
  # health-check) so a freight only reaches prod if it survives the experiments.
  verification:
    analysisTemplates:
      - name: health-check
    args:
      - name: service-url
        value: http://url-shortener-staging.url-shortener-staging.svc.cluster.local:80
