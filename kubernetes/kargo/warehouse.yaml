apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: url-shortener
  namespace: url-shortener
spec:
  # Combined freight = {image, chart commit}: a new image or a chart/config change
  # on main both create promotable freight, so config is gated like images.
  subscriptions:
    - image:
        repoURL: us-central1-docker.pkg.dev/ajprojectplatform/k8s-chaos-demo/url-shortener
        imageSelectionStrategy: NewestBuild  # newest by build time
        allowTags: ^sha-[a-f0-9]+$           # sha-<short> tags pushed by CI
        ignoreTags:
          - latest                           # mutable tag is never promotable freight
    - git:
        repoURL: https://github.com/amoghjay/k8s-chaos-promotion.git
        branch: main                         # only main — env/* branches hold promotion output
        includePaths:
          - glob:helm/url-shortener/**
        # No feedback loop: promotions push to env/* (not watched) and never write
        # to main, so the Warehouse never sees its own output as new freight.
