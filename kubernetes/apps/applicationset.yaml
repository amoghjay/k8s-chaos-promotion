apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: url-shortener
  namespace: argocd
spec:
  # List generator: hardcode the environments.
  # RENDERED-BRANCHES pattern: each env app tracks its OWN env/<env> branch, which
  # holds PLAIN rendered YAML produced by the Kargo promotion's helm-template step
  # (values-<env>.yaml is consumed THERE, at render time — see kargo/stage-*.yaml).
  # ArgoCD never runs Helm; it just applies the rendered manifests. A chart/template/
  # values change on main reaches an env ONLY when a promotion re-renders to that
  # branch, so config changes are gated dev->staging->prod like images. LEARNINGS §6.1.
  generators:
    - list:
        elements:
          - env: dev
            namespace: url-shortener-dev
          - env: staging
            namespace: url-shortener-staging
          - env: prod
            namespace: url-shortener-prod

  template:
    metadata:
      name: url-shortener-{{env}}
      namespace: argocd
      annotations:
        kargo.akuity.io/authorized-stage: "url-shortener:{{env}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/amoghjay/k8s-chaos-promotion.git
        targetRevision: env/{{env}}   # per-env rendered branch (static — Kargo never mutates it)
        path: .                        # plain rendered YAML at the branch root
        directory:
          recurse: true                # render nests under url-shortener/templates + charts/*;
                                       # ArgoCD does NOT recurse by default → without this the
                                       # apps find 0 manifests at root and prune to empty.
        # no helm: block — ArgoCD applies pre-rendered manifests, it does not template
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true      # remove resources deleted from helm chart
          selfHeal: true   # re-sync if cluster state drifts from git
        syncOptions:
          - CreateNamespace=true
