apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: url-shortener
  namespace: argocd
spec:
  # Each env app tracks its own env/<env> branch of plain YAML rendered by the
  # Kargo promotion (see kargo/stage-*.yaml). ArgoCD never runs Helm here, so a
  # chart/values change only reaches an env when a promotion re-renders its branch.
  generators:
    - list:
        elements:
          - env: dev
            namespace: url-shortener-dev
          - env: staging
            namespace: url-shortener-staging
          - env: prod
            namespace: url-shortener-prod

  template:
    metadata:
      name: url-shortener-{{env}}
      namespace: argocd
      annotations:
        kargo.akuity.io/authorized-stage: "url-shortener:{{env}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/amoghjay/k8s-chaos-promotion.git
        targetRevision: env/{{env}}   # per-env rendered branch (static — Kargo never mutates it)
        path: .
        directory:
          recurse: true                # rendered manifests are nested; without this
                                       # ArgoCD finds 0 manifests and prunes to empty
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
