# Opts staging in to Chaos Mesh injection — with enableFilterNamespace=true
# (chaos-mesh.yaml), only namespaces carrying this annotation can be targeted.
apiVersion: v1
kind: Namespace
metadata:
  name: url-shortener-staging
  annotations:
    chaos-mesh.org/inject: enabled
    # root-app must never prune this namespace — it holds all staging workloads + PVCs.
    argocd.argoproj.io/sync-options: Prune=false
