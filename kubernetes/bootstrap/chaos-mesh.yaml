apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # after observability (wave 2), before chaos-jobs (wave 5)
spec:
  project: default
  source:
    repoURL: https://charts.chaos-mesh.org
    chart: chaos-mesh
    targetRevision: "2.8.2"
    helm:
      values: |
        # GKE uses containerd — the chart's docker default leaves chaos-daemon
        # crash-looping on a non-existent socket.
        chaosDaemon:
          runtime: containerd
          socketPath: /run/containerd/containerd.sock
        controllerManager:
          # 2-node cluster — one replica, no leader election.
          replicaCount: 1
          leaderElection:
            enabled: false
          # Blast-radius lock: only namespaces annotated
          # chaos-mesh.org/inject=enabled can be targeted.
          enableFilterNamespace: true
        dashboard:
          # Keep auth on (chart default; pinned to be explicit).
          securityMode: true
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-mesh
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # required — Workflow/Schedule/WorkflowNode CRDs exceed ArgoCD's 262KB client-side apply annotation limit