# Kills the radius-signer pod for 60s: payment-signature generation outage.
# The app never calls the signer, so it should stay healthy throughout.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: signer-pod-failure
  namespace: url-shortener-staging
spec:
  action: pod-failure
  mode: one
  duration: "60s"   # must be bounded — omitting duration makes the fault persistent
  selector:
    namespaces:
      - url-shortener-staging
    labelSelectors:
      app: radius-signer   # pod template label, not app.kubernetes.io/name
