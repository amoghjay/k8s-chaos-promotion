# RBAC for the chaos-gate orchestrator Job.
#
# The Job runs in `url-shortener` (where Kargo creates the AnalysisRun), but it
# acts on `url-shortener-staging` (fires loadgen, applies the Workflow, reads
# nodes). So this is a CROSS-NAMESPACE grant: SA in url-shortener, Role +
# RoleBinding in url-shortener-staging, with the binding pointing back at the
# url-shortener SA. (Prometheus is queried over HTTP, not the k8s API — no RBAC.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-gate
  namespace: url-shortener
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-gate
  namespace: url-shortener-staging
rules:
  # PLURAL "workflows" — the real kubectl API verbs: create/delete/wait, list to prune by label.
  - apiGroups: ["chaos-mesh.org"]
    resources: ["workflows"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # SINGULAR "workflow" is NOT a typo and is REQUIRED. Chaos Mesh's vauth.kb.io is a
  # second authz layer on top of k8s RBAC: on Workflow create/delete it builds a RAW
  # SubjectAccessReview with resource = strings.ToLower(Kind) = "workflow" (singular;
  # see validate_auth.go resourceFor()). RBAC matches that string LITERALLY, so the
  # plural rule above does NOT satisfy it — without this the webhook denies with
  # "...is forbidden on namespace url-shortener-staging" even though
  # `kubectl auth can-i create workflows` returns yes (kubectl normalizes via
  # discovery; the webhook does not). podchaos is intentionally NOT granted: the
  # embedded PodChaos is created later by the workflow controller's own SA, not ours.
  - apiGroups: ["chaos-mesh.org"]
    resources: ["workflow"]
    verbs: ["create", "delete"]
  # read per-node .spec.startTime for the scorer inject times.
  - apiGroups: ["chaos-mesh.org"]
    resources: ["workflownodes"]
    verbs: ["get", "list"]
  # `kubectl create job --from=cronjob/loadgen` — read the cronjob, create the job.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  # orchestrate.sh step 6.5 captures the k6 loadgen summary into the gate log:
  # `kubectl get pods -l batch.kubernetes.io/job-name=...` (find the loadgen pod)
  # + `kubectl logs <pod>` (read its summary). pods/log is the logs subresource.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-gate
  namespace: url-shortener-staging
subjects:
  - kind: ServiceAccount
    name: chaos-gate
    namespace: url-shortener        # the SA lives in the OTHER namespace
roleRef:
  kind: Role
  name: chaos-gate
  apiGroup: rbac.authorization.k8s.io
