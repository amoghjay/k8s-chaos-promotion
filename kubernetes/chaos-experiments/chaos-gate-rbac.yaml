# RBAC for the chaos-gate orchestrator Job. Cross-namespace by design: the SA
# lives in url-shortener (where Kargo runs the AnalysisRun), the Role/RoleBinding
# in url-shortener-staging (where the Job acts).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-gate
  namespace: url-shortener
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-gate
  namespace: url-shortener-staging
rules:
  - apiGroups: ["chaos-mesh.org"]
    resources: ["workflows"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # Singular "workflow" is required, not a typo: Chaos Mesh's validation webhook
  # runs its own SubjectAccessReview with resource = lowercased Kind ("workflow"),
  # which the plural rule above does not satisfy.
  - apiGroups: ["chaos-mesh.org"]
    resources: ["workflow"]
    verbs: ["create", "delete"]
  # Per-node .spec.startTime feeds the scorer's inject times.
  - apiGroups: ["chaos-mesh.org"]
    resources: ["workflownodes"]
    verbs: ["get", "list"]
  # delete/patch let the prune step force-clear podchaos stuck on the
  # chaos-mesh/records finalizer, so a leaked fault can't poison the next run.
  - apiGroups: ["chaos-mesh.org"]
    resources: ["podchaos"]
    verbs: ["get", "list", "delete", "patch"]
  # `kubectl create job --from=cronjob/loadgen` reads the cronjob, creates the job.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  # pods + pods/log: capture the k6 loadgen summary into the gate log.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-gate
  namespace: url-shortener-staging
subjects:
  - kind: ServiceAccount
    name: chaos-gate
    namespace: url-shortener   # the SA deliberately lives in the other namespace
roleRef:
  kind: Role
  name: chaos-gate
  apiGroup: rbac.authorization.k8s.io
