# Kills the Postgres primary for 60s: source-of-truth outage. pod-failure pauses
# the pod (no data loss, PVC untouched); the app should fail fast with 503 and
# reconnect cleanly without a pod restart once Postgres returns.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: postgres-pod-failure
  namespace: url-shortener-staging
spec:
  action: pod-failure
  mode: one
  duration: "60s"   # must be bounded — omitting duration makes the fault persistent
  selector:
    namespaces:
      - url-shortener-staging
    labelSelectors:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: url-shortener-staging
      app.kubernetes.io/component: primary
