# Serial chaos-gate run: warmup, three pod-failure faults, settle. Inside a
# Workflow each fault lasts until its node deadline (the chaos `duration` field
# is ignored).
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  generateName: chaos-gate-
  namespace: url-shortener-staging
  labels:
    app: chaos-gate
spec:
  entry: gate-serial
  templates:
    - name: gate-serial
      templateType: Serial
      deadline: 720s                # hard cap for the whole run (~12m)
      children: [warmup, postgres, redis, signer, settle]

    - name: warmup
      templateType: Suspend
      deadline: 90s                 # k6 needs ~90s to reach steady state

    - name: postgres
      templateType: PodChaos
      deadline: 120s                # longer slot — PG recovery takes ~95s
      podChaos:                     # chaos spec nests under the lowercased-kind key
        action: pod-failure
        mode: one
        selector:
          namespaces:
            - url-shortener-staging
          labelSelectors:
            app.kubernetes.io/name: postgresql
            app.kubernetes.io/instance: url-shortener-staging
            app.kubernetes.io/component: primary

    - name: redis
      templateType: PodChaos
      deadline: 90s
      podChaos:
        action: pod-failure
        mode: one
        selector:
          namespaces:
            - url-shortener-staging
          labelSelectors:
            app.kubernetes.io/name: redis
            app.kubernetes.io/instance: url-shortener-staging
            app.kubernetes.io/component: master

    - name: signer
      templateType: PodChaos
      deadline: 90s
      podChaos:
        action: pod-failure
        mode: one
        selector:
          namespaces:
            - url-shortener-staging
          labelSelectors:
            app: radius-signer      # pod template label, not app.kubernetes.io/name

    - name: settle
      templateType: Suspend
      deadline: 60s                 # let metrics settle before scoring
