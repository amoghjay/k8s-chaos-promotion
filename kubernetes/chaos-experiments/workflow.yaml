apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: chaos-gate
  namespace: url-shortener-staging
spec:
  entry: gate-serial
  templates:
    - name: gate-serial
      templateType: Serial
      deadline: 720s                # top-level hard cap (~12m)
      children: [warmup, postgres, redis, signer, settle]

    - name: warmup
      templateType: Suspend
      deadline: 90s                 # k6 needs ~90s to reach steady state; 30s fired the first fault mid-ramp

    - name: postgres
      templateType: PodChaos
      deadline: 120s                # PG needs the LONGER slot (~95s recovery)
      podChaos:                      # <-- the chaos spec nests here, lowercased-kind key
        action: pod-failure
        mode: one
        selector:
          namespaces:
            - url-shortener-staging
          labelSelectors:
            app.kubernetes.io/name: postgresql
            app.kubernetes.io/instance: url-shortener-staging
            app.kubernetes.io/component: primary

    - name: redis
      templateType: PodChaos
      deadline: 90s
      podChaos:
        action: pod-failure
        mode: one                          # single pod (the lone master)
        selector:
          namespaces:
            - url-shortener-staging
          labelSelectors:
            app.kubernetes.io/name: redis
            app.kubernetes.io/instance: url-shortener-staging
            app.kubernetes.io/component: master

    - name: signer
      templateType: PodChaos
      deadline: 90s
      podChaos:
        action: pod-failure
        mode: one                          # single pod (signer runs 1 replica)
        selector:
          namespaces:
            - url-shortener-staging
          labelSelectors:
            app: radius-signer             # raw manifest pod label (jobs/radius-signer.yaml:14), NOT app.kubernetes.io/*

    - name: settle
      templateType: Suspend
      deadline: 60s                 # let metrics settle before scoring
