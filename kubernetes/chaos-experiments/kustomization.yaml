apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cluster-side pieces of the chaos gate. The experiment CRDs are applied
# standalone; workflow.yaml is mounted into the gate via the generator below.
#
# No global `namespace:` on purpose — the RBAC spans url-shortener and
# url-shortener-staging. The generated ConfigMap inherits the ArgoCD
# Application's destination; local `kubectl apply -k` needs `-n url-shortener`.
resources:
  - chaos-gate-rbac.yaml
  - external-secret-grafana.yaml

configMapGenerator:
  - name: chaos-gate-scripts
    files:
      - orchestrate.sh
      - score_experiment.py
      - workflow.yaml
      - annotate.py

# The gate Job mounts a fixed ConfigMap name, so no hash suffix.
generatorOptions:
  disableNameSuffixHash: true
