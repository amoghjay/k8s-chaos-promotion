apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploys the chaos-gate's cluster-side pieces: the orchestrator ConfigMap and
# the cross-namespace RBAC. The experiment CRDs (01/03/04) and workflow.yaml in
# this dir are NOT listed as resources — they're applied standalone (game-days)
# and workflow.yaml is mounted INTO the gate via the generator below.
#
# NO global `namespace:` here on purpose: the RBAC spans two namespaces (SA in
# url-shortener, Role/RoleBinding in url-shortener-staging), so a global override
# would be wrong. The RBAC carries explicit per-resource namespaces; the
# generated CM has none and inherits the ArgoCD Application's destination
# (url-shortener). Local `kubectl apply -k` therefore needs `-n url-shortener`.
resources:
  - chaos-gate-rbac.yaml
  - external-secret-grafana.yaml   # Grafana SA token → secret in url-shortener (verdict annotation)

configMapGenerator:
  - name: chaos-gate-scripts
    files:
      - orchestrate.sh
      - score_experiment.py
      - workflow.yaml
      - annotate.py

# Same as jobs/kustomization.yaml — the Job mounts a fixed CM name, so no hash.
generatorOptions:
  disableNameSuffixHash: true
