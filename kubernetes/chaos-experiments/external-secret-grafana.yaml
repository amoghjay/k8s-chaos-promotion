# Grafana admin credential for the chaos-gate's verdict annotation.
# Admin basic-auth rather than a service-account token: Grafana runs with no PVC,
# so a restart wipes service accounts and their tokens, while the admin user is
# re-seeded from grafana-admin-password on every start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-annotation
  namespace: url-shortener
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: grafana-annotation
    creationPolicy: Owner
    template:
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana-admin-password
