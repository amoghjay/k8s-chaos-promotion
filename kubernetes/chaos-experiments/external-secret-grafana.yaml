# Grafana SA token for the chaos-gate's end-of-run dashboard annotation
# (orchestrate.sh → annotate.py POSTs to Grafana /api/annotations).
# Lands in url-shortener (where Kargo runs the AnalysisRun's gate Job); the
# AnalysisTemplate mounts it as $GRAFANA_TOKEN (optional — gate still runs without).
# Token was minted as a Grafana service account (chaos-gate-annotator, Editor) and
# stored in Secret Manager as `grafana-annotation-token`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-annotation
  namespace: url-shortener
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: grafana-annotation
    creationPolicy: Owner
    template:
      data:
        token: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        key: grafana-annotation-token
