# Grafana admin credential for the chaos-gate's end-of-run dashboard annotation
# (orchestrate.sh → annotate.py POSTs to Grafana /api/annotations).
# Lands in url-shortener (where Kargo runs the AnalysisRun's gate Job); the
# AnalysisTemplate mounts it as $GRAFANA_PASSWORD (optional — gate still runs without).
#
# Why admin basic-auth, not a Grafana service-account token: Grafana runs with NO
# PVC (ephemeral DB), so a restart (every scale-to-zero cycle) wipes any service
# account + its token → the old Bearer-token path 401'd after the first restart.
# The admin user is re-bootstrapped from grafana-admin-secret on every start, so
# `grafana-admin-password` (same Secret Manager key that seeds Grafana's own admin)
# is stable across restarts. Trade-off: admin > a scoped Editor SA; acceptable on a
# single-tenant demo cluster. The prod-correct alt is to persist Grafana + keep the SA.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-annotation
  namespace: url-shortener
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: grafana-annotation
    creationPolicy: Owner
    template:
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana-admin-password
