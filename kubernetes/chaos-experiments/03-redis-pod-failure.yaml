# Kills the Redis master for 60s: cache outage. Redis is not on the critical
# path — the app should degrade (redirects fall back to Postgres), not fail,
# with zero restarts.
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: redis-pod-failure
  namespace: url-shortener-staging
spec:
  action: pod-failure
  mode: one
  duration: "60s"   # must be bounded — omitting duration makes the fault persistent
  selector:
    namespaces:
      - url-shortener-staging
    labelSelectors:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: url-shortener-staging
      app.kubernetes.io/component: master
