name: Build & Push gate-runner

# Tooling image for the chaos-gate Job (bash + kubectl + python3). Changes ~never
# (only on a kubectl bump), so it fires only on its own Dockerfile path — NOT
# coupled to signer/app builds. Mirrors build-radius-signer.yaml's WIF/GAR auth.
on:
  push:
    branches: [main]
    paths: ["docker/gate-runner/**"]
  pull_request:
    branches: [main]
    paths: ["docker/gate-runner/**"]
  workflow_dispatch:   # manual trigger for the first build / kubectl bumps

env:
  IMAGE: us-central1-docker.pkg.dev/ajprojectplatform/k8s-chaos-demo/gate-runner

jobs:
  build-gate-runner:
    name: Build → Push gate-runner
    runs-on: ubuntu-latest
    permissions:
      contents: read       # no commit-back (unlike signer) — :v1 is a stable mutable tag
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tags
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/382767058620/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-sa@ajprojectplatform.iam.gserviceaccount.com

      - name: Configure Docker for GAR
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker/gate-runner
          file: ./docker/gate-runner/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          # :v1 = the stable tag the AnalysisTemplate references (imagePullPolicy: Always
          # keeps it fresh); :sha- for traceability of exactly what a gate run used.
          tags: |
            ${{ env.IMAGE }}:v1
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
