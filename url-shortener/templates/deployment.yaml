---
# Source: url-shortener/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-staging
  labels:
    helm.sh/chart: url-shortener-0.1.0
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: url-shortener-staging
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
      app.kubernetes.io/instance: url-shortener-staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/instance: url-shortener-staging
        app.kubernetes.io/version: "1.0.0"
        # Chaos Mesh experiment selectors match on this label
        app: url-shortener
      annotations:
        # Roll pods when the rendered ConfigMap changes — otherwise a config-only
        # promotion syncs the ConfigMap without restarting pods, and the chaos gate
        # would validate stale config. ($ = root scope, where .Template.BasePath lives.)
        checksum/config: 2fb429b4ed9367f654377516e75c84fc440307d89634b3c63f5090c4e6c45748
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: url-shortener-staging
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          # preferred, not required — required would block scheduling entirely on a
          # full 2-node cluster
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: url-shortener
                    app.kubernetes.io/instance: url-shortener-staging
                topologyKey: kubernetes.io/hostname
      containers:
        - name: url-shortener
          image: "us-central1-docker.pkg.dev/ajprojectplatform/k8s-chaos-demo/url-shortener:sha-1f2e68e"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: url-shortener-staging-config
            - secretRef:
                name: url-shortener-staging-secret
          livenessProbe:
            # /livez is process-only and never touches Postgres/Redis — a dependency
            # outage must fail readiness, not liveness (a restart can't fix a
            # downstream DB and cascades instead).
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # /ready requires Postgres + Redis on first startup, then only Postgres.
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
