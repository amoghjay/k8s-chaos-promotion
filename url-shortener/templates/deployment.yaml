---
# Source: url-shortener/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-dev
  labels:
    helm.sh/chart: url-shortener-0.1.0
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: url-shortener-dev
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
      app.kubernetes.io/instance: url-shortener-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/instance: url-shortener-dev
        app.kubernetes.io/version: "1.0.0"
        # Chaos Mesh experiment selectors match on this label
        app: url-shortener
      annotations:
        # Roll pods when the rendered ConfigMap changes — otherwise a config-only
        # promotion syncs the ConfigMap without restarting pods, and the chaos gate
        # would validate stale config. ($ = root scope, where .Template.BasePath lives.)
        checksum/config: f35fbbad9d79772fa1965fc153421a181ff9379aacb7c89557d54d44631f2f0e
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: url-shortener-dev
      automountServiceAccountToken: false
      containers:
        - name: url-shortener
          image: "us-central1-docker.pkg.dev/ajprojectplatform/k8s-chaos-demo/url-shortener:sha-1f2e68e"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: url-shortener-dev-config
            - secretRef:
                name: url-shortener-dev-secret
          livenessProbe:
            # /livez is process-only and never touches Postgres/Redis — a dependency
            # outage must fail readiness, not liveness (a restart can't fix a
            # downstream DB and cascades instead).
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # /ready requires Postgres + Redis on first startup, then only Postgres.
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
