---
# Source: url-shortener/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-prod
  labels:
    helm.sh/chart: url-shortener-0.1.0
    app.kubernetes.io/name: url-shortener
    app.kubernetes.io/instance: url-shortener-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: url-shortener
      app.kubernetes.io/instance: url-shortener-prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url-shortener
        app.kubernetes.io/instance: url-shortener-prod
        app.kubernetes.io/version: "1.0.0"
        # Explicit label for Chaos Mesh experiment selectors (Phase 6)
        app: url-shortener
      annotations:
        # Roll the pods whenever the rendered ConfigMap changes. Without this a
        # config-only Freight syncs the ConfigMap but never restarts pods (the pod
        # spec is byte-identical), so the chaos-gate would validate STALE config.
        # Must be unconditional — config-only promotions happen on envs where
        # metrics are off too. ($ = root scope; .Template.BasePath only exists there.)
        checksum/config: 7becac336e24273fb04b15e07b3f381ef58ed58a86d443ce9d66ab624a9fce50
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: url-shortener-prod
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          # preferred — not required, so scheduling still works on a 2-node cluster
          # if both nodes are full. required would block pod scheduling entirely.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: url-shortener
                    app.kubernetes.io/instance: url-shortener-prod
                topologyKey: kubernetes.io/hostname
      containers:
        - name: url-shortener
          image: "us-central1-docker.pkg.dev/ajprojectplatform/k8s-chaos-demo/url-shortener:sha-998c447"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: url-shortener-prod-config
            - secretRef:
                name: url-shortener-prod-secret
          livenessProbe:
            # /livez: process-only check, NEVER touches Postgres/Redis. Liveness
            # answers "should k8s restart this process?" — a dependency outage must
            # fail READINESS (pull from endpoints), not LIVENESS (restart, which
            # can't fix a downstream DB). Chaos exp #1 proved /health here caused a
            # cascading-restart outage: a 60s PG blip tripped 3x503 and restarted
            # every replica. See LEARNINGS.md Phase 6.1.
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            # /ready: requires both Postgres + Redis on first startup,
            # then only Postgres after _started flag is flipped.
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 256Mi
